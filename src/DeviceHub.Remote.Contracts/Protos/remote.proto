syntax = "proto3";

// Versionado en el package desde el primer commit, igual que devicehub.v1. Un
// motor de medios cambia mas que un protocolo de inventario, y un viewer viejo
// interpretando un formato nuevo no falla: pinta basura.
package devicehub.remote.v1;

option csharp_namespace = "DeviceHub.Remote.Contracts";

// ---------------------------------------------------------------------------
// Servicio
// ---------------------------------------------------------------------------

// Servicio DEDICADO, no un metodo mas de AgentService.
//
// HTTP/2 multiplexa varios streams sobre una sola conexion TCP, asi que una
// perdida de paquetes retrasa a todos los que la compartan. Si el video viajara
// por la misma conexion que el heartbeat del agente, un keyframe atascado
// retrasaria el latido y la PC apareceria caida en el dashboard.
//
// RemoteHost y RemoteViewer son procesos distintos del Agent y del Dashboard,
// asi que cada uno abre su propia conexion de forma natural.
//
// Dentro de UNA conexion, el video (servidor->viewer) y la entrada
// (viewer->servidor) viajan en direcciones opuestas de TCP, con espacios de
// secuencia independientes: una perdida en el video no retrasa el raton. Por eso
// basta un canal por extremo y no hacen falta cuatro.
service RemoteRelayService {
  // La PC controlada. Envia video y cursor; recibe entrada y peticiones.
  rpc HostChannel (stream RemotePacket) returns (stream RemotePacket);

  // La PC del tecnico. Envia entrada; recibe video y cursor.
  rpc ViewerChannel (stream RemotePacket) returns (stream RemotePacket);
}

// ---------------------------------------------------------------------------
// Sobre
// ---------------------------------------------------------------------------

// Un solo sobre en las dos direcciones.
//
// La alternativa -- un metodo por tipo de mensaje -- obligaria a mantener el
// orden entre streams distintos, y el orden entre un VideoConfig y el frame que
// lo usa no es negociable.
message RemotePacket {
  uint32 protocol_version = 1;
  string session_id = 2;

  // Numero de secuencia POR EMISOR. Sirve para detectar huecos; no es un
  // identificador global ni cruza extremos.
  uint64 sequence = 3;

  // Cuando lo emitio quien lo manda, en microsegundos UTC. No es la marca de
  // captura del frame: esa va dentro de VideoChunk y sobrevive al relay.
  int64 timestamp_us = 4;

  oneof payload {
    Hello           hello            = 10;
    VideoConfig     video_config     = 11;
    VideoChunk      video_chunk      = 12;
    CursorUpdate    cursor           = 13;
    InputEvent      input            = 14;
    Ping            ping             = 15;
    Pong            pong             = 16;
    KeyframeRequest keyframe_request = 17;
    SessionClose    close            = 18;
    RemoteError     error            = 19;
    HelloAccepted   hello_accepted   = 20;
    HostAction      host_action      = 21;
    ClipboardText   clipboard        = 22;
    DisplayList     displays         = 23;
    SelectDisplay   select_display   = 24;

    FileListRequest     file_list_request = 25;
    FileList            file_list         = 26;
    FileDownloadRequest file_download     = 27;
    FileChunk           file_chunk        = 28;
    FileAck             file_ack          = 29;
    ClipboardFiles      clipboard_files   = 30;
    HostStatus          host_status       = 31;
    VideoAck            video_ack         = 32;
    SelectCodec         select_codec      = 33;
    SelectQuality       select_quality    = 34;

    // Fase 26. El sonido de la PC controlada.
    AudioConfig         audio_config      = 35;
    AudioChunk          audio_chunk       = 36;
    SelectAudio         select_audio      = 37;
  }
}

// ---------------------------------------------------------------------------
// Sonido (Fase 26)
// ---------------------------------------------------------------------------

// Lo que el decodificador necesita ANTES del primer paquete.
//
// AAC no es como H.264: sus parametros no pueden viajar dentro del flujo. Viven
// en el AudioSpecificConfig, y sin el no se puede descodificar ni un byte. Va
// aparte por la misma razon que VideoConfig, y se reenvia al reconectar.
message AudioConfig {
  // Siempre AAC-LC hoy. Existe para que cambiar de codec no obligue a versionar
  // el protocolo, igual que en video.
  string codec = 1;

  uint32 sample_rate = 2;
  uint32 channels = 3;
  uint32 bitrate_bits_per_second = 4;

  // El AudioSpecificConfig. Dos bytes para AAC-LC, y sin ellos el otro lado no
  // arranca.
  bytes  parameter_sets = 5;

  // Sube cada vez que el sonido se rehace -- otro dispositivo, otra frecuencia.
  // Un paquete de la version anterior descodifica ruido, no error.
  uint32 config_version = 6;
}

// Un bloque de AAC ya codificado.
//
// SIN TROCEAR, al contrario que el video: un bloque de AAC a 96 kbps son unos
// 250 bytes, cuatro ordenes de magnitud por debajo del limite de 64 KiB que
// obliga a fragmentar un keyframe.
message AudioChunk {
  uint32 config_version = 1;

  // EL MISMO RELOJ QUE EL VIDEO. Esta es la pieza que no se puede añadir
  // despues: si el sonido marcara contra otro origen, ninguna sincronia
  // posterior podria cuadrarlos -- el desfase nace aqui y solo se podria medir.
  //
  // Microsegundos desde que arranco la sesion en el HOST, igual que
  // VideoChunk.capture_timestamp_us. Restarlos entre si da el desfase real.
  int64  capture_timestamp_us = 2;

  bytes  data = 3;
}

// El tecnico enciende o apaga el sonido.
//
// APAGADO de fabrica: quien entra a arreglar una PC de planta no espera que la
// suya empiece a sonar, y en una oficina compartida eso es peor que un
// inconveniente. Se enciende a proposito.
message SelectAudio {
  bool enabled = 1;
}

// Lo que el host tiene que contar y hoy solo acaba en el log del agente.
//
// Existe porque diagnosticar una sesion remota exigia entrar en la PC de planta
// a leer el visor de eventos -- y quien esta mirando el problema es el tecnico,
// que tiene el visor delante y no puede ver nada de esto. Fallos de captura,
// cambios de escritorio, respaldos que entran: todo eso pasaba en silencio.
//
// NO lleva secretos y no sustituye al log: es la copia que ve quien mira.
message HostStatus {
  string text = 1;

  // Las MEDIDAS periodicas van aparte de los avisos.
  //
  // Un aviso -- "se releva por GDI", "no se pudo abrir la pantalla 2" -- pasa
  // una vez y tiene que quedarse a la vista. Las medidas salen cada 2 s, y por
  // el mismo hueco borrarian cualquier aviso antes de que nadie lo leyera.
  bool measurements = 2;
}

// Fase 25. Archivos en el portapapeles (CF_HDROP), en los dos sentidos.
//
// Aqui viajan RUTAS, nunca contenido: los bytes van por la transferencia de la
// Fase 24, y por eso esta fase no podia ir antes. Sin ella esto solo habria
// funcionado con archivos diminutos, que es justo lo que no se queria.
//
// Y no se transfiere solo. Copiar 4 GB con Ctrl+C es un gesto de un segundo, y
// mandarlos por la red de planta sin que nadie lo pida seria una sorpresa cara:
// se ANUNCIA, y el tecnico decide con un clic. RustDesk tampoco lo esconde --
// ensena su ventana de progreso.
message ClipboardFiles {
  repeated string paths = 1;

  // false = "esto hay aqui" (anuncio).
  // true  = "estos ya estan en TU disco: ponlos en el portapapeles".
  //         Solo se manda despues de haber transferido los bytes.
  bool apply = 2;
}

// ---------------------------------------------------------------------------
// Fase 24 -- transferencia de archivos, sin tope de tamano
// ---------------------------------------------------------------------------
//
// Va por el RELAY y no por la tuberia de comandos. La tuberia guarda el
// resultado de cada comando en una columna de MySQL, y por eso tenia un tope de
// 4 MB: bajar 500 MB serian cientos de filas y otras tantas rondas de sondeo.
// Aqui el stream ya esta abierto y los bytes no tocan la base de datos.
//
// REANUDAR es lo que convierte esto en un subsistema y no en un troceado: quien
// RECIBE es el que dice por que byte va, porque es el unico que sabe lo que
// llego de verdad a su disco.

message FileListRequest {
  // Vacio = las unidades. Es la unica forma de empezar sin saber nada de la
  // maquina de enfrente.
  string path = 1;
}

message FileList {
  string path = 1;
  repeated FileEntry entries = 2;

  // Relleno = no se pudo listar. No se manda un RemoteError porque no es la
  // sesion la que falla, solo esta carpeta.
  string error = 3;
}

message FileEntry {
  string name = 1;
  bool   directory = 2;
  uint64 size = 3;
  int64  modified_us = 4;
}

// Del viewer al host. offset > 0 es REANUDAR: el viewer ya tiene esos bytes.
message FileDownloadRequest {
  string path = 1;
  uint64 offset = 2;
}

// En los DOS sentidos: del host al viewer es una descarga, del viewer al host
// una subida.
message FileChunk {
  string path = 1;

  // Byte del archivo donde empieza `data`. No es un contador de trozos: si se
  // reanuda, el primero no empieza en cero.
  uint64 offset = 2;

  // Tamano total del archivo. 0 = todavia no se sabe.
  uint64 total = 3;

  // <= 64 KiB, el mismo tope que el video y por el mismo motivo: por debajo del
  // umbral del Large Object Heap.
  bytes data = 4;

  bool last = 5;

  // Relleno = la transferencia murio aqui. El receptor conserva lo que tenga:
  // para eso existe la reanudacion.
  string error = 6;
}

// Del que RECIBE al que manda: cuantos bytes hay confirmados en disco.
//
// Es la pieza de la reanudacion. Una subida empieza con un FileChunk vacio -- un
// sondeo -- y el host contesta con lo que ya tenga, que es el offset por donde
// seguir. Sin ese ida y vuelta, quien sube tendria que adivinarlo.
message FileAck {
  string path = 1;
  uint64 received = 2;
  string error = 3;
}

// Fase 22. Las pantallas de la PC controlada. Del host al viewer, al empezar y
// cada vez que cambian.
message DisplayList {
  repeated DisplayInfo displays = 1;

  // Lo que se esta capturando ahora. -1 = el escritorio virtual entero.
  int32 current = 2;
}

message DisplayInfo {
  int32  id      = 1;
  string name    = 2;   // \\.\DISPLAY1
  string adapter = 3;

  // Esquina y tamano dentro del escritorio VIRTUAL. El monitor de la izquierda
  // tiene x negativa, y eso no es un error: es donde Windows lo puso.
  int32 x      = 4;
  int32 y      = 5;
  int32 width  = 6;
  int32 height = 7;

  bool primary = 8;
}

// Del viewer al host. Rehace la captura entera, asi que trae config nueva y un
// IDR detras -- el SPS que el viewer tenia descodifica la pantalla anterior.
message SelectDisplay {
  // -1 = todas a la vez, compuestas en una sola imagen del tamano del escritorio
  // virtual. Es lo que permite arrastrar una ventana de un monitor a otro.
  int32 display_id = 1;
}

// Fase 21. El portapapeles de TEXTO, en los dos sentidos -- el unico payload que
// viaja en ambas direcciones aparte de Ping y Close.
//
// Solo texto. Los archivos son CF_HDROP y necesitan la transferencia troceada de
// la Fase 24: mandarlos por aqui solo funcionaria con archivos diminutos.
message ClipboardText {
  // <= 256 KiB. No es una limitacion tecnica sino una decision: el portapapeles
  // se sincroniza SOLO, sin que nadie lo pida, y copiar un log entero en la PC
  // remota no deberia mandarlo por la red sin avisar.
  string text = 1;
}

// Fase 19. Ordenes que NO son entrada: no viajan por SendInput porque Windows no
// deja generarlas asi, o porque no son un movimiento ni una tecla.
//
// Del viewer al host, como InputEvent. Un host que mandara esto estaria
// intentando reiniciar la PC del tecnico.
message HostAction {
  enum Kind {
    HOST_ACTION_UNSPECIFIED = 0;

    // Ctrl+Alt+Del. SendInput NO puede generarlo: la secuencia de atencion
    // segura esta reservada, y por eso existe SendSAS -- que exige SYSTEM y la
    // directiva SoftwareSASGeneration.
    HOST_ACTION_CTRL_ALT_DEL = 1;

    // Bloquear la PC remota al terminar, como quien cierra la puerta al salir.
    HOST_ACTION_LOCK = 2;

    // Congelar el raton y el teclado DE ALLA. Es para que nadie estorbe desde la
    // planta a mitad de una reparacion, no para esconderse: Windows lo levanta
    // solo si el proceso muere, y Ctrl+Alt+Supr lo desactiva siempre.
    HOST_ACTION_BLOCK_INPUT = 3;
    HOST_ACTION_UNBLOCK_INPUT = 4;

    // Reiniciar. El comando ya existia en el dashboard; esto es el mismo gesto
    // sin salir de la sesion.
    HOST_ACTION_REBOOT = 5;

  // Suelta TODO lo que el host tenga pulsado: teclas y botones.
  //
  // El visor la manda al conectar y al reconectar. Un KeyDown viaja y su
  // KeyUp se pierde -- porque se corto la red, porque el visor se cerro con
  // Alt pulsado, porque la cola se lleno -- y esa tecla se queda hundida en
  // la PC de planta sin que nadie pueda soltarla desde alli: el host no ve
  // el teclado fisico del tecnico, solo los eventos que le llegaron.
  HOST_ACTION_RELEASE_INPUT = 6;
  }

  Kind kind = 1;
}

// ---------------------------------------------------------------------------
// Establecimiento
// ---------------------------------------------------------------------------

enum RemoteRole {
  REMOTE_ROLE_UNSPECIFIED = 0;
  REMOTE_ROLE_HOST = 1;
  REMOTE_ROLE_VIEWER = 2;
}

// Primer mensaje de cada canal.
//
// El relay inspecciona la ESTRUCTURA de todo lo que pasa -- limites de tamano,
// direccion permitida segun el papel del emisor, config_version vigente, y
// agrupar los chunks de un frame para poder descartarlo entero -- pero no abre
// el contenido: no descodifica el video, no lo recodifica, no lo guarda y no
// toca el SPS/PPS.
//
// De este mensaje y de SessionClose si lee los campos, porque son los que
// deciden a que sesion pertenece cada extremo y cuando termina.
message Hello {
  RemoteRole role = 1;
  string machine_id = 2;

  // Ticket de un solo uso. El campo existe desde ahora para no versionar el
  // protocolo cuando llegue la Fase 6, pero HOY NO SE VALIDA NADA.
  //
  // Nunca se escribe en un log ni viaja por linea de comandos: es la credencial
  // que da acceso a ver y controlar la pantalla. Llega por named pipe con ACL
  // restringida al SID en el host, y por stdin en el viewer.
  string ticket = 3;

  // Lo que este extremo sabe hacer. Sirve para negociar sin romper: un viewer
  // que no entienda un codec nuevo no lo anuncia.
  RemoteCapabilities capabilities = 4;

  // Credencial de RECONEXION, no de primer acceso.
  //
  // Campo propio y no reutilizando `ticket` a proposito: un campo que significa
  // dos cosas segun el momento es justo la ambiguedad que obliga a versionar el
  // protocolo mas tarde.
  //
  // Se manda EN LUGAR del ticket cuando se vuelve tras un microcorte. El
  // servidor lo emitio en el HelloAccepted anterior y solo vale mientras dure la
  // gracia. Mismas reglas que el ticket: ni linea de comandos, ni logs, ni
  // disco.
  string reconnect_token = 5;
}

// Respuesta del servidor a un Hello valido. Es el unico sitio por el que sale un
// token de reconexion.
message HelloAccepted {
  RemoteSessionStateProto state = 1;

  // Token NUEVO en cada aceptacion: el anterior deja de valer en cuanto se emite
  // este. Uno que sirviera indefinidamente convertiria la gracia de reconexion
  // en una credencial permanente, que es exactamente lo que no se quiere.
  string reconnect_token = 2;

  // Hasta cuando se acepta volver sin pedir un ticket nuevo, en microsegundos
  // UTC. Pasado ese momento hace falta autorizacion del control plane otra vez.
  int64 reconnect_until_us = 3;
}

// El mismo juego de estados que RemoteSessionState en C#. Va en el protocolo
// para que el extremo sepa si esta esperando al otro o ya emparejado.
enum RemoteSessionStateProto {
  REMOTE_SESSION_STATE_UNSPECIFIED = 0;
  REMOTE_SESSION_STATE_WAITING_FOR_HOST = 1;
  REMOTE_SESSION_STATE_WAITING_FOR_VIEWER = 2;
  REMOTE_SESSION_STATE_CONNECTED = 3;
}

message RemoteCapabilities {
  uint32 max_protocol_version = 1;
  repeated VideoCodec codecs = 2;
  bool supports_input = 3;
  bool supports_cursor = 4;
}

// ---------------------------------------------------------------------------
// Video
// ---------------------------------------------------------------------------

enum VideoCodec {
  VIDEO_CODEC_UNSPECIFIED = 0;
  VIDEO_CODEC_H264 = 1;

  // Misma calidad con un 30-40 % menos de bits en la misma iGPU. Y menos bits
  // no es solo ancho de banda -- que en una LAN sobra -- es menos tiempo de
  // cable por frame, y con el acuse por frame eso se paga en cada vuelta.
  //
  // El codec lo elige el HOST y lo declara en VideoConfig. No se negocia
  // todavia: quien no pueda descodificarlo lo dice claro en vez de quedarse en
  // negro, y para eso basta con leer este campo.
  VIDEO_CODEC_H265 = 2;
}

// Como esta configurado el flujo. Se manda al empezar, al cambiar la
// configuracion y al reconectar.
//
// Los parametros van AQUI y no dentro de los frames: el receptor es nuestro
// decodificador, que ya recibio la configuracion por este canal. El archivo que
// guarda `--encode-test` hace lo contrario -- SPS/PPS delante del primer IDR --
// porque tiene que abrirse en cualquier reproductor sin contexto. No es una
// contradiccion: son dos destinos distintos.
message VideoConfig {
  // Sube en cada cambio. Cada VideoChunk lleva la version con la que se
  // codifico, asi que un frame que llega despues de un cambio de resolucion se
  // reconoce como viejo en vez de descodificarse con los parametros nuevos.
  uint32 config_version = 1;

  VideoCodec codec = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 frames_per_second = 5;
  uint32 bitrate_bits_per_second = 6;

  // SPS y PPS concatenados en Annex-B, tal y como los emite el codificador. Van
  // juntos en un solo blob a proposito: separarlos obligaria a recomponer el
  // orden en el receptor sin ganar nada.
  bytes parameter_sets = 7;

  // El trozo visible, cuando no coincide con width x height. H.264 codifica en
  // macrobloques de 16, asi que 1080 de alto viaja como 1088 y las 8 filas de
  // mas son relleno.
  uint32 visible_x = 8;
  uint32 visible_y = 9;
  uint32 visible_width = 10;
  uint32 visible_height = 11;

  // A QUE PANTALLA pertenece este flujo, y donde va colocada.
  //
  // Con varias pantallas a la vez viaja un flujo POR MONITOR y los coloca el
  // visor, en vez de componerlos en el host y mandar una sola imagen enorme. Es
  // lo que hace RustDesk (src/server/display_service.rs) y la razon es concreta:
  // componiendo, el codificador recibe la suma de los anchos -- 3840x1080 con
  // dos monitores -- y una iGPU lo rechaza. Por separado nunca ve mas de una
  // pantalla.
  //
  // layout_x/y son la esquina dentro del escritorio virtual, ya trasladada a
  // coordenadas positivas: el monitor de la izquierda tiene x negativa en
  // Windows y aqui empieza en 0.
  uint32 display_id = 12;
  uint32 layout_x = 13;
  uint32 layout_y = 14;

  // Tamano del lienzo completo, para que el visor sepa cuanto sitio reservar
  // antes de que hayan llegado todos los flujos.
  uint32 canvas_width = 15;
  uint32 canvas_height = 16;
}

// Un trozo de un frame codificado.
//
// El troceado a 64 KiB mantiene cada mensaje por debajo del umbral del Large
// Object Heap (85 000 bytes): por encima, cada chunk se reserva en un monton que
// no se compacta, y a 30 fps eso es fragmentacion continua en un proceso que
// tiene que durar un turno entero.
//
// LA UNIDAD DE DESCARTE ES EL FRAME, NUNCA EL CHUNK. `frame_id` y `chunk_count`
// estan aqui para que el relay pueda tirar todos los chunks de un frame juntos:
// descartar uno suelto fabrica una perdida que la red no tuvo, obliga al viewer
// a tirar el frame entero igualmente y ademas le cuesta un keyframe.
message VideoChunk {
  // Monotono creciente por sesion. Identifica el frame al que pertenece el
  // trozo y es lo que permite agruparlos para descartarlos juntos.
  uint64 frame_id = 1;

  uint32 chunk_index = 2;
  uint32 chunk_count = 3;

  bool key_frame = 4;

  // Con que VideoConfig se codifico. Un frame con una version que el viewer no
  // conoce se descarta: descodificarlo con los parametros equivocados no da
  // error, da imagen corrupta.
  uint32 config_version = 5;

  // Cuando lo presento el escritorio, en microsegundos. Viaja con el frame y no
  // en el sobre para que sobreviva al relay y a la fragmentacion.
  int64 capture_timestamp_us = 6;

  // Como maximo 64 KiB. Se comprueba en el receptor ANTES de reservar nada.
  bytes data = 7;

  // De que pantalla es. Los frame_id siguen siendo unicos y crecientes en toda
  // la sesion aunque haya varios flujos: asi el relay los agrupa y los descarta
  // como siempre, sin saber nada de pantallas.
  uint32 display_id = 8;
}

// El viewer perdio sincronia. Se responde con VideoConfig Y DESPUES el IDR, no
// solo el IDR: si el viewer perdio la configuracion, un keyframe suelto no le
// sirve de nada.
message KeyframeRequest {
  KeyframeReason reason = 1;

  // Ultimo frame que se reensamblo entero. Sirve para medir cuanto se perdio.
  uint64 last_good_frame_id = 2;

  // De QUE pantalla. Con varios monitores, una perdida en uno no justifica
  // gastar un IDR del otro -- y menos cuando lo que la causo fue congestion.
  uint32 display_id = 3;
}

enum KeyframeReason {
  KEYFRAME_REASON_UNSPECIFIED = 0;
  KEYFRAME_REASON_LOST_CHUNK = 1;
  KEYFRAME_REASON_RECONNECT = 2;
  KEYFRAME_REASON_CONFIG_MISMATCH = 3;
  KEYFRAME_REASON_VIEWER_REQUEST = 4;

  // El relay tiro su cola por congestion. A partir de ahi descarta todo lo que
  // no sea IDR, asi que sin pedirlo la pantalla se queda congelada hasta que el
  // codificador emita uno por su cuenta.
  KEYFRAME_REASON_CONGESTION = 5;

  // El decodificador del visor NO acepto la unidad de acceso: su MFT no pidio
  // entrada a tiempo. No es perdida de red -- todos los contadores diran que no
  // se perdio nada -- pero rompe la cadena igual, porque el frame siguiente
  // puede depender del que no entro.
  KEYFRAME_REASON_DECODER_BUSY = 6;
}

// ---------------------------------------------------------------------------
// Cursor
// ---------------------------------------------------------------------------

// Viaja FUERA del video, a 60-120 actualizaciones por segundo contra los 30 del
// video. Es lo que mas hace que el control se sienta rapido, y es barato.
message CursorUpdate {
  // Normalizadas 0.0-1.0. Nunca pixeles: el escritorio remoto puede cambiar de
  // resolucion a media sesion.
  double x = 1;
  double y = 2;

  bool visible = 3;

  // Solo cuando la forma cambia. El resto de actualizaciones son dos numeros.
  CursorShape shape = 4;
}

message CursorShape {
  uint64 shape_id = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 hotspot_x = 4;
  uint32 hotspot_y = 5;
  bytes bgra = 6;
}

// ---------------------------------------------------------------------------
// Entrada
//
// Definida aqui para que el protocolo no tenga que versionarse en las Fases 9 a
// 11. NADA de esto se ejecuta todavia: no hay SendInput en ninguna parte.
// ---------------------------------------------------------------------------

message InputEvent {
  oneof event {
    MouseMove   mouse_move   = 1;
    MouseButton mouse_button = 2;
    MouseWheel  mouse_wheel  = 3;
    KeyEvent    key          = 4;
  }
}

// Posiciones ABSOLUTAS normalizadas, no incrementos. Por eso una rafaga pendiente
// de enviar se puede reducir a la ultima: las anteriores ya no valen nada, y
// descartarlas baja la latencia en vez de perder informacion.
message MouseMove {
  double x = 1;
  double y = 2;
}

enum MouseButtonId {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_RIGHT = 2;
  MOUSE_BUTTON_MIDDLE = 3;
}

// NO es coalescible. Perder un `pressed` o su `released` deja el boton pegado en
// la maquina remota.
message MouseButton {
  MouseButtonId button = 1;
  bool pressed = 2;
  double x = 3;
  double y = 4;
}

message MouseWheel {
  int32 delta = 1;
  bool horizontal = 2;
}

// VK + scan code + extended, no caracteres: sin scan code, media tecla no
// funciona en las aplicaciones que leen el teclado a bajo nivel.
//
// Tampoco es coalescible, y por el mismo motivo que los botones: si se cae un
// KeyDown y se entrega su KeyUp, el tecnico se encuentra con un Ctrl invisible
// pulsado en la PC remota.
message KeyEvent {
  uint32 virtual_key = 1;
  uint32 scan_code = 2;
  bool pressed = 3;
  bool extended = 4;
}

// ---------------------------------------------------------------------------
// Control de sesion
// ---------------------------------------------------------------------------

// Cuantos bits se le dan a la imagen.
//
// No rehace nada: el bitrate se cambia sobre el codificador en marcha, asi que
// no hay ni config_version nueva ni parpadeo. Se nota en el frame siguiente.
message SelectQuality {
  // Sobre la base que pide la resolucion. 1.5 fiel, 0.67 equilibrado, 0.5
  // rapido, que son los tres de RustDesk.
  double ratio = 1;
}

// Cambiar de codec EN CALIENTE, sin editar un json ni reiniciar un servicio.
//
// Es la unica forma honesta de comparar H.264 con H.265: la misma PC, la misma
// pantalla y el mismo contenido, con segundos de diferencia. Editar el
// appsettings del agente y reiniciar el servicio mete minutos y un reinicio en
// medio de la comparacion, que es justo lo que docs/benchmark.md prohibe.
//
// El host rehace duplicador y codificador -- la misma cadena que un cambio de
// pantalla -- y estrena config_version. Si esa GPU no puede con el codec
// pedido, se queda en el que tenia y lo dice: lo que manda es lo que vuelva en
// VideoConfig, no lo que se pidio.
message SelectCodec {
  VideoCodec codec = 1;
}

// EL FRENO QUE IMPIDE QUE EL EMISOR SE ADELANTE AL RECEPTOR.
//
// El visor confirma cada frame que reensambla y el host no captura el
// siguiente de esa pantalla hasta tenerlo. Suena a que frena, y hace justo lo
// contrario: sin esto, entre la cola del host y la del relay caben doce frames,
// que a 20 FPS son 600 ms de escritorio viejo esperando turno. Un frame que
// espera su turno ya llega tarde.
//
// Es lo que hace RustDesk con su VideoFrameController: la latencia queda
// acotada por construccion en vez de por ajuste.
message VideoAck {
  uint64 frame_id = 1;

  // Cada pantalla lleva su propio freno: la lenta no puede frenar a la otra.
  uint32 display_id = 2;

  // RECIBIDO Y MOSTRADO SON DOS COSAS.
  //
  // false = el frame esta entero en el visor. Es lo que SUELTA EL FRENO, y se
  // manda antes de descodificar a proposito: esperar a tenerlo pintado
  // serializaria el pipeline entero contra el descodificador.
  //
  // true = el frame ya llego al swapchain. NO suelta nada; sirve para medir.
  // Sin esto, el host sabe que el transporte va bien y no sabe nada de lo que
  // pasa despues: con la red en 3 ms, el descodificador en 25 y el pintado en
  // 10, el host dice "perfecto, siguiente" mientras el tecnico todavia no ha
  // visto el anterior.
  bool presented = 3;
}

message Ping {
  int64 sent_at_us = 1;
}

message Pong {
  // Copiado tal cual del Ping. El RTT lo calcula quien pregunto, con su propio
  // reloj: los dos extremos no comparten reloj y restar tiempos de maquinas
  // distintas da numeros inventados.
  int64 sent_at_us = 1;
}

message SessionClose {
  SessionCloseReason reason = 1;

  // Texto para auditoria y para el tecnico. Nunca lleva tickets ni secretos.
  string detail = 2;
}

enum SessionCloseReason {
  SESSION_CLOSE_REASON_UNSPECIFIED = 0;
  SESSION_CLOSE_REASON_NORMAL = 1;
  SESSION_CLOSE_REASON_TICKET_EXPIRED = 2;
  SESSION_CLOSE_REASON_HOST_GONE = 3;
  SESSION_CLOSE_REASON_VIEWER_GONE = 4;
  SESSION_CLOSE_REASON_NO_INTERACTIVE_SESSION = 5;
  SESSION_CLOSE_REASON_PROTOCOL_ERROR = 6;
  SESSION_CLOSE_REASON_TIMEOUT = 7;
  SESSION_CLOSE_REASON_SERVER_SHUTDOWN = 8;
}

message RemoteError {
  RemoteErrorCode code = 1;
  string detail = 2;
}

enum RemoteErrorCode {
  REMOTE_ERROR_CODE_UNSPECIFIED = 0;
  REMOTE_ERROR_CODE_UNSUPPORTED_VERSION = 1;
  REMOTE_ERROR_CODE_INVALID_TICKET = 2;
  REMOTE_ERROR_CODE_SESSION_NOT_FOUND = 3;
  REMOTE_ERROR_CODE_ROLE_ALREADY_CONNECTED = 4;
  REMOTE_ERROR_CODE_PAYLOAD_TOO_LARGE = 5;
  REMOTE_ERROR_CODE_CAPTURE_UNAVAILABLE = 6;
  REMOTE_ERROR_CODE_ENCODER_UNAVAILABLE = 7;
}
