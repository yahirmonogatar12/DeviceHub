syntax = "proto3";

// Versionado en el package desde el dia 1 (regla 13: no romper agentes viejos).
package devicehub.v1;

option csharp_namespace = "DeviceHub.Contracts";

import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Tipos comunes
// ---------------------------------------------------------------------------

// Confianza del fingerprint de hardware. Las placas industriales y los BIOS mal
// poblados reportan UUID/serial genericos: el fingerprint es senal fuerte, no
// verdad absoluta. Solo HIGH habilita la deteccion de clonacion por hardware.
enum FingerprintConfidence {
  FINGERPRINT_CONFIDENCE_UNSPECIFIED = 0;
  FINGERPRINT_CONFIDENCE_LOW = 1;
  FINGERPRINT_CONFIDENCE_MEDIUM = 2;
  FINGERPRINT_CONFIDENCE_HIGH = 3;
}

message HardwareFingerprint {
  string hash = 1;
  FingerprintConfidence confidence = 2;
}

message NetworkInterfaceInfo {
  string name = 1;
  string ip = 2;
  string mac = 3;
  // Marcada por el agente segun la ruta real hacia el servidor, no por lista
  // negra de adaptadores virtuales.
  bool is_primary = 4;
}

// Derivado de last_seen en el servidor, nunca almacenado en columna.
enum MachineStatus {
  MACHINE_STATUS_UNSPECIFIED = 0;
  MACHINE_STATUS_ONLINE = 1;       // 0-90 s
  MACHINE_STATUS_UNREACHABLE = 2;  // 90 s - 5 min
  MACHINE_STATUS_OFFLINE = 3;      // > 5 min
}

enum IdentityState {
  IDENTITY_STATE_UNSPECIFIED = 0;
  IDENTITY_STATE_OK = 1;
  IDENTITY_STATE_CONFLICT = 2;
}

// ---------------------------------------------------------------------------
// AgentService: superficie del agente. Autenticacion por token de maquina.
// ---------------------------------------------------------------------------

service AgentService {
  // Primer arranque, o recovery de una maquina existente. Consume un codigo de
  // un solo uso; nunca un token compartido embebido en el instalador.
  rpc Register (RegisterRequest) returns (RegisterReply);

  // Stream bidireccional persistente. Los heartbeats suben por aqui y los
  // comandos (Fase 7) bajaran por el mismo canal: no hace falta transporte nuevo.
  rpc Connect (stream AgentMessage) returns (stream ServerMessage);
}

message RegisterRequest {
  string enrollment_code = 1;
  string machine_id = 2;             // GUID generado localmente, permanente
  string hostname = 3;
  HardwareFingerprint fingerprint = 4;
  string agent_version = 5;
}

message RegisterReply {
  string token = 1;                  // token permanente por maquina
  string machine_code = 2;           // autoritativo del servidor
  repeated string pinned_keys = 3;   // pines SPKI aceptados (rotacion multi-pin)
}

message AgentMessage {
  // proto3 permite agregar variantes al oneof sin romper agentes viejos.
  oneof payload {
    Heartbeat heartbeat = 1;
    HardwareInventory hardware = 2;
    MetricsBatch metrics = 3;
    CommandResult command_result = 4;
  }
}

// ---------------------------------------------------------------------------
// Comandos (Fase 7). Bajan por el MISMO stream que ya existe.
// ---------------------------------------------------------------------------

// Enum cerrado, nunca un string libre: lo que no este aqui no se puede pedir.
// El agente tambien rechaza lo que no conoce, no solo el servidor.
enum CommandType {
  COMMAND_TYPE_UNSPECIFIED = 0;
  COMMAND_TYPE_PING = 1;
  COMMAND_TYPE_GET_PROCESSES = 2;
  COMMAND_TYPE_GET_SERVICES = 3;
  COMMAND_TYPE_KILL_PROCESS = 4;
  COMMAND_TYPE_START_SERVICE = 5;
  COMMAND_TYPE_STOP_SERVICE = 6;
  COMMAND_TYPE_RESTART_SERVICE = 7;
  COMMAND_TYPE_RESTART_MACHINE = 8;
  COMMAND_TYPE_SHUTDOWN_MACHINE = 9;

  // Fase 14. Van por el mismo canal de comandos: son peticiones con respuesta,
  // no hacia falta un subsistema aparte. La transferencia va en un solo mensaje
  // con tope de 4 MB en vez de troceada -- ver PathGuard.MaxTransferBytes.
  COMMAND_TYPE_LIST_DIRECTORY = 10;
  COMMAND_TYPE_CREATE_DIRECTORY = 11;
  COMMAND_TYPE_DELETE_PATH = 12;
  COMMAND_TYPE_RENAME_PATH = 13;
  COMMAND_TYPE_READ_FILE = 14;
  COMMAND_TYPE_WRITE_FILE = 15;

  // Fase 15. Solo se emite dentro de una sesion de terminal abierta y auditada:
  // el servidor nunca acepta este tipo suelto desde SendCommand.
  COMMAND_TYPE_RUN_SHELL = 16;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_PENDING = 1;
  COMMAND_STATUS_SENT = 2;
  COMMAND_STATUS_RUNNING = 3;
  COMMAND_STATUS_COMPLETED = 4;
  COMMAND_STATUS_FAILED = 5;
  COMMAND_STATUS_EXPIRED = 6;
  COMMAND_STATUS_CANCELLED = 7;
}

message CommandRequest {
  string command_id = 1;              // clave de idempotencia
  CommandType type = 2;
  map<string, string> parameters = 3;

  // Sin esto, una PC apagada dos horas ejecutaria al reconectar un reinicio que
  // alguien pidio hace dos horas. El agente comprueba el vencimiento ANTES de
  // ejecutar: es la proteccion real, no un adorno de reporteria.
  google.protobuf.Timestamp expires_at = 4;
}

message CommandResult {
  string command_id = 1;
  CommandStatus status = 2;
  string result = 3;                  // texto, o JSON para GetProcesses/GetServices
  string error_code = 4;
  string agent_version = 5;
}

// Fase 6. El agente muestrea cada 5 s, agrega por minuto y envia el lote cada
// 60 s. Nunca una fila por segundo en MySQL.
//
// Va en lote y no suelto porque el buffer local puede acumular horas si el
// servidor estuvo caido: al reconectar se drena todo de una.
message MetricsBatch {
  repeated MetricSample samples = 1;
}

message MetricSample {
  google.protobuf.Timestamp minute = 1;   // minuto UTC truncado; clave de idempotencia
  float cpu_avg = 2;
  float cpu_max = 3;                      // el pico importa: un avg del 40% puede esconder un 100% sostenido
  float memory_avg = 4;
  float memory_max = 5;
  float disk_min_free_percent = 6;        // el disco mas apretado de la maquina
  int64 net_rx_bytes_per_sec = 7;
  int64 net_tx_bytes_per_sec = 8;
}

// Fase 5. NO viaja en el heartbeat: se envia al conectar, cada 12 h, y cuando
// el hash cambia. Mandar esto cada 30 s seria tirar ancho de banda y escrituras
// para repetir datos que no se mueven en meses.
message HardwareInventory {
  string hash = 1;                  // SHA256 del contenido; decide si hay algo nuevo
  string cpu_model = 2;
  int32 cpu_cores = 3;
  int32 cpu_threads = 4;
  int64 total_memory_bytes = 5;
  string gpu_model = 6;
  string motherboard = 7;
  string bios_version = 8;
  string bios_serial = 9;
  string os_caption = 10;
  string os_version = 11;
  string os_build = 12;
  repeated DiskInfo disks = 13;
}

// Solo lo estatico. El espacio libre cambia a cada minuto: es una METRICA
// (Fase 6), y meterlo aqui haria que el hash cambiara siempre, convirtiendo el
// inventario en un heartbeat caro.
message DiskInfo {
  string model = 1;
  int64 size_bytes = 2;
}

message Heartbeat {
  string hostname = 1;
  repeated NetworkInterfaceInfo interfaces = 2;
  string logged_user = 3;
  int64 uptime_seconds = 4;
  string agent_version = 5;
  HardwareFingerprint fingerprint = 6;
  // Pines que el agente tiene cargados. Es la puerta del paso 2 de la rotacion
  // de certificado: no se cambia el cert hasta que el 100% reporte el nuevo.
  repeated string pinned_keys = 7;

  RemoteAgentInfo remote = 8;
}

// Fase 10. Deliberadamente OPACO: `provider` y `device_id` son strings sin
// estructura. Ni el contrato, ni la BD, ni el dashboard saben que existe
// RustDesk -- eso vive dentro del detector y del provider. Cambiar de motor en
// la Fase 18 no toca este mensaje.
message RemoteAgentInfo {
  string provider = 1;
  string device_id = 2;
  bool available = 3;
}

message ServerMessage {
  oneof payload {
    ConfigUpdate config = 1;
    CommandRequest command = 2;
  }
}

message ConfigUpdate {
  string machine_code = 1;           // renombrar sin tocar la PC
  repeated string pinned_keys = 2;
}

// ---------------------------------------------------------------------------
// AdminService: superficie del dashboard. Autenticacion por JWT con rol.
// ---------------------------------------------------------------------------

service AdminService {
  rpc Login (LoginRequest) returns (LoginReply);
  rpc ListMachines (ListMachinesRequest) returns (ListMachinesReply);
  rpc GetMachine (MachineRef) returns (MachineDetail);
  rpc WatchMachines (WatchRequest) returns (stream MachineSummary);
  rpc MoveMachine (MoveMachineRequest) returns (MachineDetail);
  rpc CreateEnrollmentCode (CreateEnrollmentCodeRequest) returns (EnrollmentCodeReply);
  rpc ResolveIdentityConflict (ResolveConflictRequest) returns (MachineDetail);
  rpc ListUsers (ListUsersRequest) returns (UserList);
  rpc CreateUser (CreateUserRequest) returns (UserRecord);
  rpc UpdateUser (UpdateUserRequest) returns (UserRecord);
  rpc ChangeOwnPassword (ChangeOwnPasswordRequest) returns (UserRecord);
  rpc GetRotationReadiness (RotationReadinessRequest) returns (RotationReadinessReply);
  rpc ListAudit (AuditQuery) returns (AuditList);
  rpc StartTerminalSession (MachineRef) returns (TerminalSessionReply);
  rpc RunTerminalCommand (TerminalCommandRequest) returns (TerminalCommandReply);
  rpc EndTerminalSession (RemoteSessionRef) returns (TerminalSessionReply);
  // Fase 6. Deliberadamente APARTE de StartRemoteSession: ese decide COMO se
  // lanza cada motor, y eso es la Fase 8. Este solo autoriza, que es lo unico
  // que la Fase 6 tiene que resolver.
  rpc IssueRemoteTickets (IssueRemoteTicketsRequest) returns (IssueRemoteTicketsResponse);
  rpc StartRemoteSession (MachineRef) returns (RemoteSessionReply);
  rpc EndRemoteSession (RemoteSessionRef) returns (RemoteSessionReply);
  rpc SendCommand (SendCommandRequest) returns (CommandEntry);
  rpc ListCommands (MachineRef) returns (CommandList);
  rpc GetCommand (CommandRef) returns (CommandEntry);
}

// --------------------------------------------------------------------------
// Fase 13: usuarios y rotacion de certificado.
// --------------------------------------------------------------------------

message ListUsersRequest {}

message UserList {
  repeated UserRecord users = 1;
}

message UserRecord {
  string username = 1;
  string role = 2;                            // viewer|technician|engineer|administrator
  bool is_active = 3;
  string created_by = 4;
  google.protobuf.Timestamp last_login_at = 5;
}

message CreateUserRequest {
  string username = 1;
  string password = 2;
  string role = 3;
}

message UpdateUserRequest {
  string username = 1;
  string role = 2;        // vacio = sin cambio
  bool set_active = 3;
  bool is_active = 4;
  string new_password = 5; // vacio = sin cambio
}

message ChangeOwnPasswordRequest {
  string current_password = 1;
  string new_password = 2;
}

message RotationReadinessRequest {
  // Pin SPKI candidato. Se responde cuantas maquinas ya lo aceptan.
  string candidate_pin = 1;
}

// La puerta del paso 2 de la rotacion: no se cambia el certificado hasta que
// TODAS las maquinas alcanzables reportan el pin nuevo.
message RotationReadinessReply {
  int32 online_machines = 1;
  int32 ready_machines = 2;
  bool safe_to_rotate = 3;
  repeated string pending_machine_codes = 4;
}

// Fase 12. Se llama AuditRecord y no AuditEntry para no chocar con el tipo
// interno del servidor que construye estas filas.
message AuditQuery {
  string machine_id = 1;   // vacio = toda la planta
  int32 limit = 2;
}

message AuditList {
  repeated AuditRecord entries = 1;
}

message AuditRecord {
  google.protobuf.Timestamp occurred_at = 1;
  string user_id = 2;
  string user_role = 3;
  string action = 4;
  string machine_code = 5;
  string site_code = 6;
  string source_ip = 7;
  string outcome = 8;      // allowed | denied | failed
  string details = 9;
}

// Fase 15. No existe "ejecuta este comando" suelto: hay que abrir sesion, y
// cada comando queda ligado a ella con su salida.
message TerminalSessionReply {
  string session_id = 1;
  string machine_code = 2;
  string working_dir = 3;
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
  int32 command_count = 6;
}

message TerminalCommandRequest {
  string session_id = 1;
  string command = 2;
}

message TerminalCommandReply {
  int32 sequence = 1;
  string output = 2;
  int32 exit_code = 3;
  string working_dir = 4;    // puede cambiar si el comando fue un `cd`
  bool truncated = 5;
  int32 duration_ms = 6;
}

message RemoteSessionRef {
  string session_id = 1;
}

// Lo que el dashboard necesita para lanzar el cliente local. Nada aqui nombra a
// RustDesk: `launch_target` es lo que el provider decida que hay que ejecutar.
// La identidad del tecnico NO viaja aqui: sale del principal autenticado. Si
// viniera en el mensaje, cualquiera con permiso para llamar podria emitir un
// ticket a nombre de otro, y el ticket dejaria de decir quien pidio la sesion.
message IssueRemoteTicketsRequest {
  string target_machine_id = 1;   // la PC que se va a controlar
  string viewer_machine_id = 2;   // la PC del tecnico, si ya se conoce
}

// Los dos secretos salen UNA sola vez y en claro. El servidor solo se queda con
// su SHA-256; no hay forma de recuperarlos despues, ni la tiene que haber.
message IssueRemoteTicketsResponse {
  string session_id = 1;
  string host_ticket = 2;
  string viewer_ticket = 3;
  int64 expires_at_us = 4;
}

message RemoteSessionReply {
  string session_id = 1;
  string provider = 2;
  string device_id = 3;
  string launch_target = 4;   // ejecutable
  string launch_arguments = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
}

message SendCommandRequest {
  string machine_id = 1;
  CommandType type = 2;
  map<string, string> parameters = 3;
}

message CommandRef {
  string command_id = 1;
}

message CommandList {
  repeated CommandEntry commands = 1;
}

message CommandEntry {
  string command_id = 1;
  string machine_id = 2;
  CommandType type = 3;
  CommandStatus status = 4;
  string requested_by = 5;
  google.protobuf.Timestamp requested_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp completed_at = 8;
  string result = 9;
  string error_code = 10;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginReply {
  string token = 1;
  string username = 2;
  string role = 3;                   // viewer | technician | engineer | administrator
}

message ListMachinesRequest {
  string site_code = 1;              // vacio = todos
  string area = 2;
  string line = 3;
}

message ListMachinesReply {
  repeated MachineSummary machines = 1;
}

message MachineRef {
  string machine_id = 1;
}

message MachineSummary {
  string machine_id = 1;
  string site_code = 2;
  string machine_code = 3;
  string display_name = 4;
  string hostname = 5;
  string area = 6;
  string line = 7;
  string station = 8;
  string current_ip = 9;
  string primary_mac = 10;
  string logged_user = 11;
  string agent_version = 12;
  int64 uptime_seconds = 13;
  google.protobuf.Timestamp last_seen = 14;  // siempre UTC
  MachineStatus status = 15;
  IdentityState identity_state = 16;

  // Ultima medicion conocida. Es una observacion, no un valor derivable de otra
  // columna: por eso si se almacena, a diferencia de `status`.
  float cpu_percent = 17;
  float memory_percent = 18;
  float disk_free_percent = 19;
  google.protobuf.Timestamp metrics_at = 20;

  // El dashboard solo necesita saber SI se puede controlar, no con que ni con
  // que identificador. El device_id no se le enseña al tecnico.
  bool remote_available = 21;
}

message MachineDetail {
  MachineSummary summary = 1;
  repeated IpHistoryEntry ip_history = 2;
  repeated PlacementHistoryEntry placement_history = 3;
  HardwareFingerprint fingerprint = 4;
  HardwareInventory hardware = 5;
  google.protobuf.Timestamp hardware_collected_at = 6;
}

message IpHistoryEntry {
  string ip = 1;
  string mac = 2;
  google.protobuf.Timestamp valid_from = 3;
  google.protobuf.Timestamp valid_to = 4;   // ausente = vigente
}

message PlacementHistoryEntry {
  string site_code = 1;
  string machine_code = 2;
  string area = 3;
  string line = 4;
  string station = 5;
  google.protobuf.Timestamp valid_from = 6;
  google.protobuf.Timestamp valid_to = 7;
  string changed_by = 8;
}

message WatchRequest {
  string site_code = 1;
}

// Renombrar y mover: machine_id es inmutable, todo lo demas es editable.
message MoveMachineRequest {
  string machine_id = 1;
  string site_code = 2;
  string machine_code = 3;
  string display_name = 4;
  string area = 5;
  string line = 6;
  string station = 7;
}

message CreateEnrollmentCodeRequest {
  int32 max_uses = 1;                // default 1
  int32 valid_minutes = 2;           // default 30
  string site_code = 3;
  // Con valor: recovery code de una maquina existente (conserva identidad e
  // historial). Vacio: enrolamiento de maquina nueva.
  string target_machine_id = 4;
}

message EnrollmentCodeReply {
  string code = 1;                   // se muestra una sola vez, se guarda hasheado
  google.protobuf.Timestamp expires_at = 2;
  int32 max_uses = 3;
}

message ResolveConflictRequest {
  string machine_id = 1;
  Resolution resolution = 2;

  enum Resolution {
    RESOLUTION_UNSPECIFIED = 0;
    RESOLUTION_APPROVE_NEW_HARDWARE = 1;  // cambio legitimo de placa
    RESOLUTION_ISSUE_NEW_IDENTITY = 2;    // era un clon
  }
}
